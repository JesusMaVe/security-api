services:
  api:
    build: .
    environment:
      API_KEY: ${API_KEY:-dev-secret-123}
      PORT: 8080
      ALLOW_ORIGIN: ${ALLOW_ORIGIN:-*}
    ports:
      - "8081:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      retries: 5
